{% extends 'base.html' %}

{% block content %}

<div class="container">

    <div class="page-header d-flex justify-content-between align-items-center mb-4">

        <h2>
            <i class="bi bi-box-seam"></i>
            {% if form.instance.pk %}
                Editar Material
            {% else %}
                Novo Material
            {% endif %}
        </h2>

        <a href="{% url 'materiais' %}" class="valor-btn-outline">
            <i class="bi bi-arrow-left"></i>
            Voltar
        </a>

    </div>

    <div class="valor-card-table">

        <div class="card-body">

            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <div class="d-flex justify-content-end gap-2 mt-4">

                    <a href="{% url 'materiais' %}" class="valor-btn-outline">
                        <i class="bi bi-arrow-left"></i>
                        Cancelar
                    </a>

                    <button type="submit" class="valor-btn-primary">
                        <i class="bi bi-check-circle"></i>
                        Salvar
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
